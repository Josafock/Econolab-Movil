name: Feature CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      full:
        description: Ejecutar comprobaciones de todas las HUs implementadas
        type: boolean
        default: false
      native:
        description: Incluir APK y aceptación nativa antes de una liberación
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: feature-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline.yml
    with:
      full: ${{ inputs.full || false }}
      native: ${{ inputs.native || github.event_name == 'pull_request' }}
