name: SonarCloud de la planeación
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Exigir la vinculación real con SonarCloud
        run: test -n "$SONAR_TOKEN" && test -n "$SONAR_PROJECT_KEY" && test -n "$SONAR_ORGANIZATION"
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ci/run-tests.cjs all
      - name: Análisis estático y Quality Gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
        with:
          args: -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
