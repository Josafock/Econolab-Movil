name: Firma del APK de octubre

on:
  push:
    branches: ['feature/HU-08-evidencias-octubre']
    paths: ['.github/workflows/october-apk.yml', 'docs/evidencias-rubrica/APK_OCTUBRE.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Descargar y comprobar integridad
        run: |
          mkdir -p reports/october-apk
          URL=$(node -e "const m=require('./docs/evidencias-rubrica/APK_OCTUBRE.json');const u=new URL(m.downloadUrl);if(u.protocol!=='https:'||u.hostname!=='expo.dev'||!u.pathname.startsWith('/artifacts/eas/')||!/^[a-f0-9]{64}$/.test(m.sha256))throw Error('Metadatos no validos');process.stdout.write(u.href)")
          curl --proto '=https' --proto-redir '=https' -fL "$URL" -o /tmp/econolab-octubre.apk
          EXPECTED=$(node -p "require('./docs/evidencias-rubrica/APK_OCTUBRE.json').sha256")
          echo "$EXPECTED  /tmp/econolab-octubre.apk" | sha256sum --check
      - name: Verificar firma version y permisos
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs /tmp/econolab-octubre.apk > reports/october-apk/firma.txt
          "$AAPT" dump badging /tmp/econolab-octubre.apk > reports/october-apk/manifiesto.txt
          "$AAPT" dump permissions /tmp/econolab-octubre.apk > reports/october-apk/permisos.txt
          node <<'NODE'
          const fs = require('node:fs');
          const m = require('./docs/evidencias-rubrica/APK_OCTUBRE.json');
          const signature = fs.readFileSync('reports/october-apk/firma.txt', 'utf8');
          const certificate = signature.match(/certificate SHA-256 digest:\s*([a-f0-9]+)/i)?.[1].toLowerCase();
          if (!m.certificatesSha256.includes(certificate)) throw Error('Firma distinta de la identificada.');
          const manifest = fs.readFileSync('reports/october-apk/manifiesto.txt', 'utf8');
          if (!manifest.includes("name='com.econolab.mobile'") || !manifest.includes(`versionCode='${m.versionCode}'`) || !manifest.includes(`versionName='${m.version}'`) || manifest.includes('application-debuggable')) throw Error('Paquete o version distintos; o APK depurable.');
          const permissions = fs.readFileSync('reports/october-apk/permisos.txt', 'utf8');
          if (/android\.permission\.(CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)/.test(permissions)) throw Error('Permiso peligroso no requerido por esta entrega.');
          fs.writeFileSync('reports/october-apk/verificacion.json', JSON.stringify({ runId: process.env.GITHUB_RUN_ID,
            buildId: m.buildId, sourceCommit: m.sourceCommit, sha256: m.sha256, version: m.version,
            versionCode: m.versionCode, certificateSha256: certificate, signatureVerified: true,
            packageVerified: true, debuggable: false, scope: 'Firma criptografica, integridad, identidad y permisos; no sustituye las pruebas de interfaz.' }, null, 2));
          NODE
      - name: Guardar verificacion
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apk-octubre-verificado
          path: reports/october-apk/
          retention-days: 90
          if-no-files-found: error
