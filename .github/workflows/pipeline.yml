name: Pipeline reutilizable por HU

on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_API_URL: https://example.invalid/api

jobs:
  security:
    uses: ./.github/workflows/security.yml

  plan:
    name: Seleccionar issues y alcance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-features: ${{ steps.plan.outputs.has-features }}
      native: ${{ steps.plan.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - id: plan
        name: Asociar rama, archivos y referencias a HUs
        env:
          CI_FULL: ${{ inputs.full }}
        run: node scripts/ci/plan.cjs
      - name: Guardar plan de pruebas
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/plan.json
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Lint, TypeScript y regresión completa
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias reproducibles
        id: install
        run: npm ci --no-audit --no-fund
      - name: Probar la selección del pipeline
        id: ci_tests
        run: |
          node --test tests/ci/*.test.cjs
          npm run release:check
      - name: ESLint
        id: lint
        run: |
          mkdir -p reports
          npm run lint 2>&1 | tee reports/lint.log
      - name: TypeScript en checkout limpio
        id: typecheck
        run: npm run typecheck 2>&1 | tee reports/typecheck.log
      - name: Todas las pruebas de aplicación disponibles y cobertura
        id: tests
        run: node scripts/ci/run-tests.cjs all
      - name: Registrar resultados de las etapas de calidad
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          fs.mkdirSync('reports', { recursive: true });
          const steps = JSON.parse(process.env.CI_STEPS);
          const ids = ['install', 'ci_tests', 'lint', 'typecheck', 'tests'];
          fs.writeFileSync('reports/quality-steps.json', JSON.stringify(Object.fromEntries(ids.map(id => [id, steps[id]?.conclusion || 'unknown'])), null, 2));
          NODE
      - name: Guardar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  report:
    name: ${{ github.event_name == 'pull_request' && 'CI obligatorio PR' || 'Reporte CI' }}
    needs: [security, plan, quality, features, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Recuperar plan
        id: plan_evidence
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/evidence
      - name: Recuperar regresión y diagnóstico
        id: quality_evidence
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/evidence
      - name: Recuperar evidencia de las HUs
        id: feature_evidence
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: tests-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/evidence
      - name: Generar reporte y plantilla de seguimiento
        id: report
        if: always()
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_REPORT_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/report.cjs
      - name: Guardar reporte de seguimiento
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reporte-seguimiento-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/final/
          if-no-files-found: error
          retention-days: 90
      - name: Exigir resultado completo del pipeline
        if: always()
        env:
          CI_APPROVED: ${{ steps.report.outputs.approved }}
        run: |
          if [ "$CI_APPROVED" != "true" ]; then
            echo '::error::CI no aprobado. Consulta el reporte de seguimiento y las etapas fallidas o canceladas.'
            exit 1
          fi

  features:
    name: ${{ matrix.feature }} · issue ${{ matrix.issue }} · ${{ matrix.title }}
    needs: [plan, quality]
    if: needs.plan.outputs.has-features == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Pruebas y cobertura pendiente de la issue
        env:
          CI_FEATURE: ${{ matrix.feature }}
        run: node scripts/ci/run-tests.cjs "$CI_FEATURE"
      - name: Guardar evidencia por HU
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tests-${{ matrix.feature }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Entrega ${{ matrix.platform }}
    needs: [security, plan, quality, features]
    if: >-
      always() && !cancelled() && needs.security.result == 'success' && needs.quality.result == 'success' &&
      (needs.features.result == 'success' || needs.features.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios, web]
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://example.invalid/api' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Validar generación nativa de HU-02 y de main
        if: needs.plan.outputs.native == 'true' && matrix.platform != 'web'
        env:
          CI_PLATFORM: ${{ matrix.platform }}
        run: npx expo prebuild --platform "$CI_PLATFORM" --no-install
      - name: Exportar bundle
        env:
          CI_PLATFORM: ${{ matrix.platform }}
        run: npx expo export --platform "$CI_PLATFORM" --output-dir "dist/$CI_PLATFORM"
      - name: Registrar versión y checksum de la entrega
        env:
          CI_PLATFORM: ${{ matrix.platform }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const root = path.join('dist', process.env.CI_PLATFORM);
          const files = fs.readdirSync(root, { recursive: true }).filter(file => fs.statSync(path.join(root, file)).isFile()).sort();
          const checksums = files.map(file => `${crypto.createHash('sha256').update(fs.readFileSync(path.join(root, file))).digest('hex')}  ${file.replaceAll('\\', '/')}`);
          fs.writeFileSync(path.join(root, 'SHA256SUMS.txt'), checksums.join('\n') + '\n');
          fs.writeFileSync(path.join(root, 'delivery.json'), JSON.stringify({ commit: process.env.GITHUB_SHA, platform: process.env.CI_PLATFORM, run: process.env.GITHUB_RUN_ID, packageVersion: require('./package.json').version, kind: 'expo-bundle' }, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Entrega ${process.env.CI_PLATFORM}\nBundle y recursos con checksums SHA-256. No es APK/AAB/IPA ni una instalación física comprobada.\n`);
          NODE
      - name: Entregar artifact descargable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: econolab-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
