name: Android Debug Release pinning y JADX

on:
  push:
    branches: ['fix/HU-08-seguridad-rubrica']
    paths: ['.github/workflows/native-verification.yml', 'native-tests/**', '.maestro/**', 'plugins/**', 'app.config.js']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: econolab_test
          POSTGRES_PASSWORD_FILE: /proc/sys/kernel/random/uuid
          POSTGRES_DB: econolab_native_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U econolab_test -d econolab_native_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://10.0.2.2:3110/api
      ECONOLAB_NATIVE_QA: '1'
      NODE_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      DATABASE_USER: econolab_test
      DATABASE_NAME: econolab_native_test
      DATABASE_SSL: 'false'
      THROTTLE_LIMIT: '10000'
      APP_ENABLE_HSTS: 'false'
      SECURITY_SCAN_HOLD: '1'
      SECURITY_QA_UI_EMAIL: native-qa@example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DavidHdz117/Backend_Econolab_Escuela
          ref: 602f9e2969edba026618437415f1242e662e0d1a
          path: qa-backend
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Preparar TLS y credenciales desechables
        run: |
          mkdir -p .native-qa reports/native
          openssl req -x509 -newkey rsa:2048 -nodes -keyout .native-qa/server.key -out .native-qa/server.pem -days 2 -subj '/CN=10.0.2.2' -addext 'subjectAltName=IP:10.0.2.2,IP:127.0.0.1,DNS:localhost'
          PIN=$(openssl x509 -in .native-qa/server.pem -pubkey -noout | openssl pkey -pubin -outform DER | openssl dgst -sha256 -binary | openssl enc -base64)
          PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$PASSWORD"
          echo "ECONOLAB_QA_TLS_PIN=$PIN" >> "$GITHUB_ENV"
          echo "ECONOLAB_QA_CA_FILE=$GITHUB_WORKSPACE/.native-qa/server.pem" >> "$GITHUB_ENV"
          echo "SECURITY_QA_TLS_CERT=$GITHUB_WORKSPACE/.native-qa/server.pem" >> "$GITHUB_ENV"
          echo "SECURITY_QA_TLS_KEY=$GITHUB_WORKSPACE/.native-qa/server.key" >> "$GITHUB_ENV"
          echo "SECURITY_QA_UI_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          JWT_VALUE=$(openssl rand -hex 32)
          echo "::add-mask::$JWT_VALUE"
          echo "JWT_SECRET=$JWT_VALUE" >> "$GITHUB_ENV"
          DB_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$DB_PASSWORD"
          docker exec "${{ job.services.postgres.id }}" psql -U econolab_test -d econolab_native_test -c "ALTER ROLE econolab_test WITH PASSWORD '$DB_PASSWORD';"
          echo "DATABASE_PASS=$DB_PASSWORD" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - name: Instalar backend aislado
        working-directory: qa-backend
        run: npm ci --no-audit --no-fund
      - name: Iniciar backend de pruebas
        working-directory: qa-backend
        run: |
          node node_modules/ts-node/dist/bin.js --transpile-only -r tsconfig-paths/register test/mobile-security.ts > /tmp/econolab-native-backend.log 2>&1 &
          echo "QA_BACKEND_PID=$!" >> "$GITHUB_ENV"
          for n in $(seq 1 90); do
            test -f reports/mobile-security/ready && exit 0
            sleep 2
          done
          cat /tmp/econolab-native-backend.log
          exit 1
      - name: Generar Android y verificar R8 y permisos
        run: |
          npx expo prebuild --platform android --no-install
          cp android/app/build.gradle reports/native/build.gradle
          cp android/gradle.properties reports/native/gradle.properties
          cp android/app/src/main/AndroidManifest.xml reports/native/AndroidManifest.xml
          grep -F 'android.enableMinifyInReleaseBuilds=true' android/gradle.properties
          grep -F 'android.enableShrinkResourcesInReleaseBuilds=true' android/gradle.properties
          grep -F 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
      - name: Recuperar dependencias y compilaciones C++ de Android
        id: gradle_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/app/.cxx
            android/app/build/intermediates/cxx
            node_modules/**/android/.cxx
            node_modules/**/android/build/intermediates/cxx
          key: native-android-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.config.js', 'plugins/**', 'native-tests/**') }}-${{ github.sha }}
          restore-keys: |
            native-android-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.config.js', 'plugins/**', 'native-tests/**') }}-
            native-android-v1-${{ runner.os }}-
      - name: Compilar Debug Release y pruebas TLS nativas
        id: native_build
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease :app:testReleaseUnitTest -PreactNativeArchitectures=x86_64 --build-cache --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx4g > ../reports/native/gradle.log 2>&1
      - name: Guardar caché de Android incluso ante un fallo posterior
        if: always() && steps.gradle_cache.outputs.cache-primary-key != '' && steps.gradle_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/app/.cxx
            android/app/build/intermediates/cxx
            node_modules/**/android/.cxx
            node_modules/**/android/build/intermediates/cxx
          key: ${{ steps.gradle_cache.outputs.cache-primary-key }}
      - name: Instalar Maestro con checksum publicado
        run: |
          curl -fL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip -o /tmp/maestro.zip
          curl -fL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/checksums_sha256.txt -o /tmp/maestro-checksums.txt
          cd /tmp
          grep 'maestro.zip$' maestro-checksums.txt | sha256sum --check
          unzip -q maestro.zip -d /tmp
          echo /tmp/maestro/bin >> "$GITHUB_PATH"
      - name: Preparar emulador y Metro de Debug
        env:
          NODE_ENV: development
          EXPO_OFFLINE: '1'
        run: |
          sudo sh -c 'echo "KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          npx expo start --localhost --port 8081 > /tmp/econolab-metro.log 2>&1 &
          METRO_PID=$!
          echo "QA_METRO_PID=$METRO_PID" >> "$GITHUB_ENV"
          for n in $(seq 1 60); do
            if ! kill -0 "$METRO_PID" 2>/dev/null; then cat /tmp/econolab-metro.log; exit 1; fi
            curl --max-time 3 -fsS http://127.0.0.1:8081/status | grep -q 'packager-status:running' && exit 0
            sleep 2
          done
          cat /tmp/econolab-metro.log
          exit 1
      - name: Ejecutar caja negra en ambos builds
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb reverse tcp:8081 tcp:8081
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            maestro test -e APP_ID=com.econolab.mobile.qa -e EMAIL=native-debug@example.test -e PASSWORD="$SECURITY_QA_UI_PASSWORD" --format junit --output reports/native/maestro-debug.xml --test-output-dir reports/native/debug .maestro/native-smoke.yml
            adb uninstall com.econolab.mobile.qa
            kill "$QA_METRO_PID"
            adb install android/app/build/outputs/apk/release/app-release.apk
            maestro test -e APP_ID=com.econolab.mobile.qa -e EMAIL=native-release@example.test -e PASSWORD="$SECURITY_QA_UI_PASSWORD" --format junit --output reports/native/maestro-release.xml --test-output-dir reports/native/release .maestro/native-smoke.yml
      - name: Analizar Release con JADX
        if: always() && steps.native_build.outcome == 'success'
        run: |
          curl -fL https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          node scripts/security/analyze-release.cjs android/app/build/outputs/apk/release/app-release.apk /tmp/jadx/bin/jadx
      - name: Cerrar entorno de prueba
        if: always()
        run: |
          if [ -n "$QA_BACKEND_PID" ]; then kill "$QA_BACKEND_PID" || true; fi
          if [ -n "$QA_METRO_PID" ]; then kill "$QA_METRO_PID" || true; fi
          cp -R android/app/build/test-results reports/native/ 2>/dev/null || true
          cp android/app/build/outputs/mapping/release/mapping.txt reports/native/ 2>/dev/null || true
          cp /tmp/econolab-metro.log reports/native/metro.log 2>/dev/null || true
          cp /tmp/econolab-native-backend.log reports/native/backend.log 2>/dev/null || true
          node scripts/security/redact-qa-reports.cjs
      - name: Conservar evidencias nativas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-security-verification
          path: reports/native/
          if-no-files-found: error
          retention-days: 30
