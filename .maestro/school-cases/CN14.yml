appId: ${APP_ID}
name: CN14 Pérdida y recuperación de red
---
- tapOn: Cortes
- extendedWaitUntil:
    visible: Cortes por fecha
    timeout: 60000
- scrollUntilVisible:
    element:
      text: Cortes por fecha
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    element:
      text: Desde \(AAAA-MM-DD\)
      below: Desde \(AAAA-MM-DD\)
    direction: DOWN
    timeout: 30000
- tapOn:
    text: Desde \(AAAA-MM-DD\)
    below: Desde \(AAAA-MM-DD\)
    point: 95%,50%
- eraseText: 100
- inputText: 2026-11-24
- hideKeyboard
- scrollUntilVisible:
    element:
      text: Hasta \(AAAA-MM-DD\)
      below: Hasta \(AAAA-MM-DD\)
    direction: DOWN
    timeout: 30000
- tapOn:
    text: Hasta \(AAAA-MM-DD\)
    below: Hasta \(AAAA-MM-DD\)
    point: 95%,50%
- eraseText: 100
- inputText: 2026-11-24
- hideKeyboard
- setAirplaneMode: enabled
- scrollUntilVisible:
    element:
      text: Consultar resumen
    direction: DOWN
    timeout: 30000
- tapOn: Consultar resumen
- scrollUntilVisible:
    element:
      text: .*(conexión|conectar|red|tiempo|momento).*
    direction: DOWN
    timeout: 90000
- takeScreenshot: CN14-red-interrumpida
- setAirplaneMode: disabled
- scrollUntilVisible:
    element:
      text: Cortes por fecha
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    element:
      text: Consultar resumen
    direction: DOWN
    timeout: 30000
- tapOn: Consultar resumen
- scrollUntilVisible:
    element:
      text: "[$]0[.]00"
    direction: DOWN
    timeout: 30000
- assertVisible: "[$]0[.]00"
- takeScreenshot: CN14-aprobado
